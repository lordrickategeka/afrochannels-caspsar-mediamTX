<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | AMCP Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-slate-800/80 border border-slate-700/60 rounded-xl p-8 shadow-lg">
    <h1 class="text-xl font-bold text-sky-400 mb-1">AMCP Dashboard</h1>
    <p class="text-slate-400 text-sm mb-6">Stream Branding & Live Production Console</p>

    <form id="login-form" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label for="username" class="text-xs font-medium text-slate-400 uppercase tracking-wider">Username</label>
        <input type="text" id="username" autocomplete="username" required
          class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:outline-none focus:border-sky-500 transition">
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="password" class="text-xs font-medium text-slate-400 uppercase tracking-wider">Password</label>
        <input type="password" id="password" autocomplete="current-password" required
          class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:outline-none focus:border-sky-500 transition">
      </div>
      <div id="error" class="text-red-400 text-sm hidden"></div>
      <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-2.5 rounded-lg font-medium text-sm transition mt-2">
        Sign In
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.message || 'Invalid username or password');
        }
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
